[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autodatabench"
version = "0.1.0"
description = "A benchmark for agents that improve training data under resource budgets."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["bench_core*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

