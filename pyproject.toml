[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autodatabench"
version = "0.1.0"
description = "A data-centric testbed for evaluating agents that improve training data."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27,<1", "inspect-ai==0.3.232", "pyyaml>=6,<7"]

[project.urls]
Paper = "https://arxiv.org/abs/2609.40097"
Repository = "https://github.com/AutoDataBench/AutoDataBench"
"Data and models" = "https://huggingface.co/AutoDataBench"

[project.optional-dependencies]
dev = ["pytest>=8"]
retrieval = [
    "mteb==2.15.4",
    "numpy==2.4.6",
    "sentence-transformers==5.6.0",
    "torch==2.6.0",
    "transformers==5.12.1",
]
knowledge-injection = [
    "accelerate==1.14.0",
    "huggingface-hub==0.36.2",
    "peft==0.20.0",
    "safetensors==0.8.0",
    "torch==2.7.0",
    "transformers==4.51.3",
    "vllm==0.9.2",
]
function-call = [
    "accelerate==1.14.0",
    "datasets==5.0.1",
    "peft==0.20.0",
    "scipy==1.15.3",
    "torch==2.7.0",
    "transformers==4.51.3",
]

[tool.setuptools.packages.find]
include = ["bench_core*", "bench_helpers*", "bench_inspect*", "bench_tasks*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
